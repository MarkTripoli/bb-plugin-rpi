<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{Artifact title}</title>
<style>
  :root { color-scheme: dark; --bg:#1b1e28; --panel:#171922; --line:#303340; --text:#a6accd; --bright:#fff; --accent:#add7ff; --mint:#5de4c7; --rose:#d0679d; --blue:#89ddff; --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; --sans: system-ui, -apple-system, Segoe UI, sans-serif; }
  * { box-sizing: border-box; border-radius: 0; }
  body { margin: 0; padding: 24px 20px 96px; background: var(--bg); color: var(--text); font: 15px/1.7 var(--sans); }
  main { max-width: 1120px; margin: 0 auto; }
  h1, h2, h3 { color: var(--accent); line-height: 1.25; }
  h1 { margin-top: 0; font-size: 24px; }
  h2 { font-size: 18px; }
  h3 { font-size: 14px; font-family: var(--mono); text-transform: uppercase; letter-spacing: .08em; color: var(--text); }
  p, li { max-width: 84ch; }
  code, pre { font-family: var(--mono); }
  code { background: #303340; padding: 0 .3em; }
  pre { overflow-x: auto; background: var(--panel); border: 1px solid var(--line); padding: 12px; }
  .card { border: 1px solid var(--line); background: var(--panel); padding: 18px; margin: 14px 0; }
  .badge { display: inline-block; border: 1px solid var(--line); padding: 2px 6px; font: 11px/1.4 var(--mono); text-transform: uppercase; }
  .b-new { color: var(--mint); border-color: rgba(93,228,199,.45); }
  .b-note { color: var(--blue); border-color: rgba(137,221,255,.45); }
  .b-risk { color: var(--rose); border-color: rgba(208,103,157,.45); }
  .ba { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 850px) { .ba { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<main>
  <h1>{Artifact title}</h1>
  <p>Replace this with a focused diagram, mockup, or annotated comparison. Use realistic labels and keep the artifact tied to one decision.</p>
</main>
</body>
</html>
